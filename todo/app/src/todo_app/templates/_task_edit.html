{% set root = request.headers.get('x-ingress-path', '') %}
<li class="task task-editing">
  <div class="edit-grid">
    <input class="edit-title" name="title" value="{{ task.title }}" required aria-label="Title">
    <input name="due_date" type="date" value="{{ task.due_date or '' }}" aria-label="Due date">
    <select name="priority" aria-label="Priority">
      {% for p in ['low', 'normal', 'high'] %}
      <option value="{{ p }}" {{ 'selected' if task.priority == p }}>{{ p }}</option>
      {% endfor %}
    </select>
    <input name="tags" value="{{ task.tags | join(', ') }}" placeholder="tags, comma, separated"
           aria-label="Tags">
  </div>
  <textarea name="description" rows="2" placeholder="Description"
            aria-label="Description">{{ task.description }}</textarea>
  <div class="edit-actions">
    <button class="btn btn-primary" hx-post="{{ root }}/tasks/{{ task.id }}/edit"
            hx-include="closest li, #filters" hx-target="#task-table">Save</button>
    <button class="btn btn-ghost" hx-get="{{ root }}/tasks/table"
            hx-include="#filters" hx-target="#task-table">Cancel</button>
  </div>
</li>
