{% set root = request.headers.get('x-ingress-path', '') %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="{{ root }}/static/app.css">
  <script src="{{ root }}/static/htmx.min.js"></script>
</head>
<body>
<main>
  <header class="app-header">
    <h1>Todo</h1>
  </header>

  <form class="add-form" hx-post="{{ root }}/tasks/new" hx-target="#task-table" hx-include="#filters"
        hx-on::after-request="if(event.detail.successful) this.reset()">
    <div class="add-bar">
      <input name="title" placeholder="Add a task…" required autocomplete="off">
      <button type="submit">Add</button>
    </div>
    <details class="add-more">
      <summary>More options</summary>
      <div class="add-more-fields">
        <input name="due_date" type="date" aria-label="Due date">
        <select name="priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
        </select>
        <input name="tags" placeholder="tags, comma, separated" autocomplete="off">
        <textarea name="description" placeholder="Description (optional)" rows="2"></textarea>
      </div>
    </details>
  </form>

  <form id="filters" class="filters" hx-get="{{ root }}/tasks/table" hx-target="#task-table"
        hx-trigger="change, input delay:300ms from:[name='search']">
    <div class="segmented">
      <label><input type="radio" name="status" value="all" {% if status == 'all' %}checked{% endif %}><span>All</span></label>
      <label><input type="radio" name="status" value="open" {% if status == 'open' %}checked{% endif %}><span>Open</span></label>
      <label><input type="radio" name="status" value="done" {% if status == 'done' %}checked{% endif %}><span>Done</span></label>
    </div>
    <select name="tag" aria-label="Tag filter">
      <option value="">Any tag</option>
      {% for t in all_tags %}
      <option value="{{ t }}" {% if t == tag %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
    <input name="search" type="search" placeholder="Search…" value="{{ search }}" autocomplete="off">
  </form>

  <div id="task-table">
    {% include "_task_table.html" %}
  </div>
</main>
</body>
</html>
