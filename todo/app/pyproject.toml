[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-todo"
version = "0.4.0"
description = "Todo app: FastAPI core + HTMX web UI + Typer CLI, packaged as a Home Assistant add-on"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
todo = "todo_app.cli:app"
todo-server = "todo_app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_app"]
