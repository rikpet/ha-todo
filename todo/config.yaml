name: Todo
version: "0.1.1"
slug: todo
description: Simple todo list with web UI, REST API and CLI access
url: https://github.com/rikpet/ha-todo
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:check-circle-outline
panel_title: Todo
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: REST API / web UI for LAN access (CLI needs this)
watchdog: http://[HOST]:[PORT:8099]/health
options:
  api_token: ""
  log_level: info
schema:
  api_token: str
  log_level: list(debug|info|warning|error)
