name: Todo
version: "0.7.0"
slug: todo
description: Simple todo list with web UI, REST API and CLI access
url: https://github.com/rikpet/ha-todo
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:check-circle-outline
panel_title: Todo
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI / REST API on the LAN (unauthenticated - disable if unwanted)
watchdog: http://[HOST]:[PORT:8099]/health
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
